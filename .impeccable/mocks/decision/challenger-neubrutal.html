<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #F4F0E6; color: #111; font-family: "Atkinson Hyperlegible", sans-serif; }
  .page { width: 1440px; height: 900px; padding: 36px; display: grid; grid-template-rows: 88px 1fr 200px; gap: 24px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 6px solid #111; }
  header strong { font-family: "Archivo Black", sans-serif; font-size: 42px; }
  .back { font-size: 22px; border: 4px solid #111; background: #111; color: #F4F0E6; padding: 8px 16px; box-shadow: 6px 6px 0 #111; }
  .hero { background: #F0B429; border: 6px solid #111; box-shadow: 12px 12px 0 #111; padding: 36px 40px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { font-family: "Archivo Black", sans-serif; font-size: 108px; line-height: 0.84; letter-spacing: -0.03em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .block { border: 6px solid #111; box-shadow: 8px 8px 0 #111; padding: 22px 24px; }
  .block h2 { font-family: "Archivo Black", sans-serif; font-size: 48px; line-height: 0.9; }
  .live { background: #FF4D8D; }
  .tour { background: #2F6BFF; color: #F4F0E6; }
  p { font-size: 22px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <strong>DJKRIDP</strong>
      <span class="back">ZURÜCK ZUR SEITE</span>
    </header>
    <article class="hero">
      <h1>MIND &amp; SOUL</h1>
      <p>We Love Trance Records. Öffnen, dann zurück.</p>
    </article>
    <div class="row">
      <article class="block live"><h2>TWITCH</h2><p>djkridp</p></article>
      <article class="block tour"><h2>TOUR</h2><p>DE CA ZA JP RU PL ES IT</p></article>
    </div>
  </div>
</body>
</html>
