<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:1440px; height:900px; overflow:hidden; font-family:Arial,Helvetica,sans-serif; position:relative;
    background:#0B0B12 }
  .floor { position:absolute; left:0; right:0; bottom:0; height:340px;
    background:linear-gradient(180deg,#12121E,#0B0B12); transform:perspective(600px) rotateX(40deg); transform-origin:top }
  .grid { position:absolute; left:-200px; right:-200px; bottom:0; height:360px;
    background-image:linear-gradient(rgba(124,92,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.25) 1px,transparent 1px);
    background-size:80px 60px; transform:perspective(700px) rotateX(55deg); transform-origin:top }
  /* floating logo orb */
  .orb { position:absolute; left:50%; top:300px; transform:translate(-50%,-50%); width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #22D3EE, #7C5CFF 60%, #2A1B6E); box-shadow:0 0 140px #7C5CFF, 0 0 60px #22D3EE }
  .orb::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:120px; height:120px; border-radius:50%; background:#0B0B12 }
  .ring { position:absolute; left:50%; top:300px; transform:translate(-50%,-50%) rotateX(72deg); width:560px; height:560px; border-radius:50%; border:2px solid #22D3EE55 }
  .neon { position:absolute; top:120px; height:6px; border-radius:3px; box-shadow:0 0 30px currentColor }
  .n1 { left:60px; width:300px; background:#7C5CFF; color:#7C5CFF }
  .n2 { right:80px; width:220px; background:#22D3EE; color:#22D3EE }
  .n3 { left:200px; top:170px; width:140px; background:#22D3EE; color:#22D3EE; opacity:.6 }
  h1 { position:absolute; left:50%; top:640px; transform:translateX(-50%); color:#fff; font-size:64px; font-weight:800; letter-spacing:.1em; text-shadow:0 0 40px #7C5CFF }
  .sub { position:absolute; left:50%; top:730px; transform:translateX(-50%); color:#B9B9D0; font-size:14px; letter-spacing:.3em }
  .vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.5)) }
</style></head><body>
  <div class="grid"></div><div class="floor"></div>
  <div class="neon n1"></div><div class="neon n2"></div><div class="neon n3"></div>
  <div class="ring"></div><div class="orb"></div>
  <h1>DJKRIDP</h1>
  <div class="sub">SCROLL TO ENTER</div>
  <div class="vignette"></div>
</body></html>
