<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:1440px; height:900px; overflow:hidden; font-family:Arial,Helvetica,sans-serif; position:relative;
    background:linear-gradient(180deg,#2A1D08 0%,#4A330F 38%,#1A1206 62%,#0D0A05 100%) }
  /* haze band */
  .haze { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 46%, #F5A62355 0%, transparent 55%) }
  /* mirrored ceiling: the sun completed above */
  .mirror { position:absolute; left:0; right:0; top:0; height:200px; transform:scaleY(-1); opacity:.85;
    background:linear-gradient(180deg,#0D0A05, transparent); overflow:hidden }
  .mirror .half { position:absolute; left:50%; top:-260px; transform:translateX(-50%); width:520px; height:520px; border-radius:50%; background:#F5A623; filter:blur(2px) }
  /* the half sun on the far wall */
  .sun { position:absolute; left:50%; top:40px; transform:translateX(-50%); width:520px; height:260px; border-radius:260px 260px 0 0; background:#F5A623; box-shadow:0 0 180px #F5A623 }
  .horizon { position:absolute; left:0; right:0; top:300px; height:3px; background:#F5A623; opacity:.8 }
  /* floor silhouettes */
  .fig { position:absolute; bottom:80px; width:26px; height:60px; background:#0D0A05; border-radius:12px 12px 0 0 }
  .fig.sit { height:36px; border-radius:14px }
  .fig .sh { position:absolute; left:0; top:60px; width:26px; height:50px; background:linear-gradient(180deg,#0D0A05CC,transparent); transform:scaleY(-1); transform-origin:top }
  .floor { position:absolute; left:0; right:0; bottom:0; height:260px; background:linear-gradient(180deg,transparent,#0D0A05) }
  h1 { position:absolute; left:80px; bottom:110px; color:#F5E9D0; font-size:54px; font-weight:800; letter-spacing:.03em }
  .sub { position:absolute; left:82px; bottom:72px; color:#F5E9D0; font-size:15px; letter-spacing:.2em; opacity:.65 }
  .tag { position:absolute; right:80px; bottom:80px; color:#F5E9D0; font-size:12px; letter-spacing:.26em; opacity:.5; text-align:right }
</style></head><body>
  <div class="mirror"><div class="half"></div></div>
  <div class="sun"></div><div class="horizon"></div><div class="haze"></div>
  <div class="floor"></div>
  <div class="fig" style="left:380px"><div class="sh"></div></div>
  <div class="fig sit" style="left:540px;bottom:70px"><div class="sh" style="top:36px"></div></div>
  <div class="fig" style="left:760px;bottom:96px"><div class="sh"></div></div>
  <div class="fig sit" style="left:940px"><div class="sh" style="top:36px"></div></div>
  <div class="fig" style="left:1120px;bottom:64px"><div class="sh"></div></div>
  <h1>ONE SUN, EVERYONE UNDER IT</h1>
  <div class="sub">WALK THE LONG AXIS — YOUR POINTER IS A SILHOUETTE</div>
  <div class="tag">HALL 1 — DUSK FREQUENCY<br>MONO 589 NM</div>
</body></html>
